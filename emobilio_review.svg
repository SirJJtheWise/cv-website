<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-gradient2)" />
  <defs>
    <linearGradient id="bg-gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Lines -->
  <line x1="400" y1="225" x2="250" y2="225" stroke="#34d399" stroke-width="4" filter="url(#glow2)" stroke-dasharray="8 4" />
  <line x1="400" y1="225" x2="550" y2="150" stroke="#34d399" stroke-width="4" filter="url(#glow2)" stroke-dasharray="8 4" />
  <line x1="400" y1="225" x2="550" y2="300" stroke="#34d399" stroke-width="4" filter="url(#glow2)" stroke-dasharray="8 4" />

  <!-- Center Node: AI Agents -->
  <circle cx="400" cy="225" r="50" fill="#064e3b" stroke="#34d399" stroke-width="3" filter="url(#glow2)"/>
  <image href="https://cdn.simpleicons.org/openai/white" x="375" y="200" height="50" width="50" />
  <text x="400" y="295" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">AI Engine</text>

  <!-- Left: NLP / Reviews -->
  <circle cx="250" cy="225" r="45" fill="#064e3b" stroke="#34d399" stroke-width="2" />
  <image href="https://cdn.simpleicons.org/googlemessages/white" x="227" y="202" height="45" width="45" />

  <!-- Top Right: Fonio.ai -->
  <rect x="500" y="120" width="100" height="60" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2" />
  <text x="550" y="157" font-family="sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Fonio.ai</text>

  <!-- Bottom Right: Docsbot -->
  <rect x="500" y="270" width="100" height="60" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2" />
  <text x="550" y="307" font-family="sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Docsbot</text>
</svg>
