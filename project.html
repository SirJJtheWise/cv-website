<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Details | Jason Mann</title>
    <style>
        /* Project Specific Styles */
        .project-header {
            padding-top: 8rem;
            padding-bottom: 4rem;
            text-align: center;
        }

        .back-nav {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .detail-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1rem 4rem 1rem;
        }

        .main-media {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: var(--radius-md);
            margin-bottom: 3rem;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content-block h2 {
            border-left: 3px solid var(--primary);
            padding-left: 1rem;
            margin: 2rem 0 1rem;
            color: var(--primary);
        }

        .content-block p,
        .content-block ul {
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .content-block ul {
            padding-left: 1.5rem;
            list-style: disc;
        }

        /* Animated entrance */
        main {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s ease forwards;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
  <script type="module" crossorigin src="./assets/project-j7r3eAOy.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/style-CTz7fj_L.js">
  <link rel="stylesheet" crossorigin href="./assets/style-D-D5v3Is.css">
</head>

<body>

    <nav class="back-nav">
        <a href="./index.html" class="glass-panel"
            style="padding: 0.5rem 1rem; border-radius: 50px; display: flex; align-items: center; gap: 0.5rem; font-weight: 600;">
            ← Back to Home
        </a>
    </nav>

    <main class="detail-container">
        <header class="project-header">
            <h1 class="gradient-text" id="p-title" style="font-size: 3rem; margin-bottom: 0.5rem;">Loading...</h1>
            <p id="p-subtitle" style="font-size: 1.5rem; color: var(--text-muted);">Please wait</p>

            <div id="p-tags"
                style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap;">
                <!-- Tags injected here -->
            </div>
        </header>

        <div class="main-media" id="media-container">
            <!-- Video or Image injected here -->
            <p style="color: #555;">No media available</p>
        </div>

        <div class="content-block glass-panel" style="padding: 2rem;">
            <div id="p-content">
                <!-- Description injected here -->
            </div>
        </div>
    </main>

    <footer style="text-align:center; padding: 2rem; opacity: 0.5; font-size: 0.8rem;">
        &copy; 2026 Jason Mann.
    </footer>

</body>

</html>
