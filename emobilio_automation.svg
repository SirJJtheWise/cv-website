<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-gradient)" />
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Lines -->
  <line x1="400" y1="225" x2="200" y2="150" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" stroke-dasharray="8 4" />
  <line x1="400" y1="225" x2="600" y2="150" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" stroke-dasharray="8 4" />
  <line x1="400" y1="225" x2="400" y2="350" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" stroke-dasharray="8 4" />

  <!-- Center Node: n8n -->
  <circle cx="400" cy="225" r="50" fill="#1e293b" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
  <image href="https://cdn.simpleicons.org/n8n/white" x="375" y="200" height="50" width="50" />

  <!-- Top Left: HubSpot -->
  <circle cx="200" cy="150" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <image href="https://cdn.simpleicons.org/hubspot/white" x="177" y="127" height="45" width="45" />

  <!-- Top Right: Shopify -->
  <circle cx="600" cy="150" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <image href="https://cdn.simpleicons.org/shopify/white" x="577" y="127" height="45" width="45" />

  <!-- Bottom: Xano -->
  <circle cx="400" cy="350" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="400" y="358" font-family="sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Xano</text>
</svg>
